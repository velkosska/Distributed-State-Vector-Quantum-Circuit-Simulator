name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openmp: [OFF, ON]
    name: build (OpenMP=${{ matrix.openmp }})
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # -march=native is off: CI runners vary, and results must not depend on it
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQSIM_NATIVE=OFF -DQSIM_OPENMP=${{ matrix.openmp }}

      - name: Build
        run: cmake --build build -j 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: env/requirements.txt

      - name: Install Python dependencies
        run: pip install -r env/requirements.txt

      - name: Validate against Qiskit (2..12 qubits, tol 1e-10)
        env:
          OMP_NUM_THREADS: 2
        run: python3 src/tools/validate_qiskit.py --qsim build/qsim --max-qubits 12 --csv validation.csv

      - name: Validate with gate fusion (--fusion 1q)
        env:
          OMP_NUM_THREADS: 2
        run: |
          printf '#!/bin/sh\nexec "%s" "$@" --fusion 1q\n' "$PWD/build/qsim" > qsim_fused
          chmod +x qsim_fused
          python3 src/tools/validate_qiskit.py --qsim qsim_fused --max-qubits 12

      - name: Generator and analysis smoke test
        run: |
          python3 src/tools/gen_circuits.py random -n 10 --depth 4 --seed 1 --global-fraction 0.5 --global-qubits 2 -o rg.txt
          ./build/qsim rg.txt --quiet
          ./build/qsim rg.txt --quiet --fusion 1q
          python3 src/tools/analyze_circuit.py rg.txt --ranks 1,2,4

      - name: Run harness smoke test (local mode, tiny sizes)
        env:
          HARNESS_SKIP_MODULES: 1
        run: |
          QUBITS="8 10" REPEATS=2 bash slurm/baseline.sbatch
          ./build/stream_triad 16 2
          test "$(tail -n +2 results/baseline/local-*/runs.csv | grep -c ',ok,')" -eq 12

      - name: Analysis tests
        run: python3 -m pytest analysis -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-openmp-${{ matrix.openmp }}
          path: validation.csv

  mpi:
    runs-on: ubuntu-latest
    name: build (MPI + OpenMP)
    steps:
      - uses: actions/checkout@v4

      - name: Install Open MPI
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin

      - name: Configure
        run: >
          cmake -S . -B build-mpi -DCMAKE_BUILD_TYPE=Release -DQSIM_NATIVE=OFF
          -DQSIM_MPI=ON -DQSIM_OPENMP=ON -DMPIEXEC_PREFLAGS=--oversubscribe

      - name: Build
        run: cmake --build build-mpi -j 4

      - name: Unit tests (serial kernels; distributed vs serial on 1, 2, 4, 8 ranks)
        env:
          OMP_NUM_THREADS: 1
        run: ctest --test-dir build-mpi --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: env/requirements.txt

      - name: Install Python dependencies
        run: pip install -r env/requirements.txt

      - name: Validate against Qiskit on 4 ranks, remapping on and off
        env:
          OMP_NUM_THREADS: 1
        run: |
          python3 src/tools/validate_qiskit.py --qsim build-mpi/qsim_mpi --launcher "mpirun --oversubscribe -np 4" \
            --min-qubits 3 --max-qubits 12 --csv validation-mpi.csv
          printf '#!/bin/sh\nexec "%s" "$@" --no-remap\n' "$PWD/build-mpi/qsim_mpi" > qsim_mpi_noremap
          chmod +x qsim_mpi_noremap
          python3 src/tools/validate_qiskit.py --qsim qsim_mpi_noremap --launcher "mpirun --oversubscribe -np 4" \
            --min-qubits 3 --max-qubits 12

      - name: Validate gate fusion on 4 ranks
        env:
          OMP_NUM_THREADS: 1
        run: |
          printf '#!/bin/sh\nexec "%s" "$@" --fusion 1q\n' "$PWD/build-mpi/qsim_mpi" > qsim_mpi_fused
          chmod +x qsim_mpi_fused
          python3 src/tools/validate_qiskit.py --qsim qsim_mpi_fused --launcher "mpirun --oversubscribe -np 4" \
            --min-qubits 3 --max-qubits 12

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-mpi
          path: validation-mpi.csv
